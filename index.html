<!DOCTYPE html>
<html>
<head>
  <title>My Web Workspace</title>
</head>
<body>
  <h1>My Web Workspace</h1>
  <p>Welcome to my website!</p>
  <input id="search" placeholder="Search Google">
  <button onclick="searchWeb()">Search</button>

  <script>
    function searchWeb() {
      const query = document.getElementById("search").value;
      window.open(
        "https://www.google.com/search?q=" + encodeURIComponent(query),
        "_blank"
      );
    }
  </script>
</body>
</html>
